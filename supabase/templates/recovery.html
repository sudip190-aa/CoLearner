<!doctype html>
<html lang="en"><body style="margin:0;background:#f5f8fe;font-family:Arial,sans-serif;color:#142039;padding:32px 16px">
<main style="max-width:480px;margin:auto;background:white;border:1px solid #e6ebf2;border-radius:16px;padding:32px">
<p style="color:#2e78e5;font-weight:bold">CoLearn</p>
<h1 style="font-size:26px">Reset your password</h1>
<p style="line-height:1.6">Follow this secure link to choose a new password for your CoLearn account.</p>
<p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#2e78e5;color:white;text-decoration:none;border-radius:10px;padding:14px 22px">Reset password</a></p>
<p style="color:#64748b;font-size:13px;line-height:1.6">If you didn’t request this change, you can ignore this email. Your password will stay the same.</p>
</main></body></html>
