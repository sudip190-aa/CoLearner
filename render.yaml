# Render Static Sites are free and do not use a paid compute plan.
services:
  - type: web
    runtime: static
    name: colearn
    repo: https://github.com/sudip190-aa/CoLearner
    branch: main
    rootDir: CoLearner
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_SUPABASE_URL
        value: https://ghjdpcvnzclfvyosfhoz.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(self)
      - path: /call-notifications-sw.js
        name: Cache-Control
        value: no-cache
